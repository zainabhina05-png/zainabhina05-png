name: generate snake

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: zainabhina05-png
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#5f7052&color_dots=#ebedf0,#d7e3c4,#b3c896,#8ba46f,#5f7052
            dist/github-contribution-grid-snake-dark.svg?color_snake=#9fbf7c&color_dots=#161b22,#1d2b18,#2f4a25,#4a6f38,#79ab5c

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
